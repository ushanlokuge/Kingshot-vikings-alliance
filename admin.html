<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kingshot Viking Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body class="bg-dark text-light">

<div class="container mt-4">

    <h1>⚔ Kingshot Viking Manager</h1>

    <hr>

    <div class="row">

        <div class="col-md-3">

            <div class="list-group" id="sidebar">

                <button
                    class="list-group-item list-group-item-action active"
                    data-page="players">
                    👥 Players
                </button>
            
                <button
                    class="list-group-item list-group-item-action"
                    data-page="heroes">
                    🛡 Heroes
                </button>
            
                <button
                    class="list-group-item list-group-item-action"
                    data-page="groups">
                    📂 Groups
                </button>
            
                <button
                    class="list-group-item list-group-item-action"
                    data-page="generate">
                    ⚔ Generate
                </button>

            </div>

        </div>

        <div class="col-md-9">

            <div id="content">

             
            </div>

        </div>

    </div>

</div>
<!-- Add Player Modal -->
<!-- Player Modal -->
<div class="modal fade" id="playerModal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content bg-dark text-light border-secondary">

            <div class="modal-header border-secondary">

                <h5 class="modal-title" id="playerModalTitle">
                    Add Player
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="row g-3">

                    <!-- Player Name -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Player Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="playerName"
                            placeholder="Enter player name">

                    </div>

                    <!-- Group -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Group
                        </label>

                        <select
                            class="form-select"
                            id="playerGroup">

                        </select>

                    </div>

                    <!-- Account Type -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Account Type
                        </label>

                        <select
                            class="form-select"
                            id="playerAccountType">

                            <option value="Main">🔵 Main</option>
                            <option value="Farm">🟣 Farm</option>

                        </select>

                    </div>

                    <!-- Marches -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Marches
                        </label>

                        <select
                            class="form-select"
                            id="playerMarches">

                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5" selected>5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>

                        </select>

                    </div>

                    <!-- Notes -->
                    <div class="col-12">

                        <label class="form-label">
                            Notes
                        </label>

                        <textarea
                            class="form-control"
                            id="playerNotes"
                            rows="3"
                            placeholder="Optional notes..."></textarea>

                    </div>

                    <!-- Active -->
                    <div class="col-12">

                        <div class="form-check form-switch">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="playerActive"
                                checked>

                            <label
                                class="form-check-label"
                                for="playerActive">

                                Active Player

                            </label>

                        </div>

                    </div>

                </div>

            </div>

            <div class="modal-footer border-secondary">

                <button
                    class="btn btn-outline-light"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    class="btn btn-success"
                    id="savePlayerBtn">

                    💾 Save Player

                </button>

            </div>

        </div>

    </div>

</div>

<!-- Group Modal -->
<div class="modal fade" id="groupModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content bg-dark text-light">

            <div class="modal-header">

                <h5 class="modal-title">
                    Add Group
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <input
                    type="hidden"
                    id="groupId">

                <label class="form-label">
                    Group Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="groupName"
                    placeholder="Enter group name">

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    class="btn btn-success"
                    id="saveGroupBtn">

                    Save Group

                </button>
                
            </div>

        </div>

    </div>

</div>    
<!-- Hero Modal -->
<div class="modal fade" id="heroModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content bg-dark text-light">

            <div class="modal-header">

                <h5 class="modal-title">Hero</h5>

                <button
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <input type="hidden" id="heroId">

                <div class="mb-3">

                    <label>Hero Name</label>

                    <input
                        type="text"
                        class="form-control"
                        id="heroName">

                </div>

                <div class="mb-3">

                    <label>Order</label>

                    <input
                        type="number"
                        class="form-control"
                        id="heroOrder">

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    class="btn btn-success"
                    id="saveHeroBtn">

                    Save Hero

                </button>

            </div>

        </div>

    </div>

</div>    
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>  
 <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script type="module" src="js/admin.js"></script>

</body>
</html>
