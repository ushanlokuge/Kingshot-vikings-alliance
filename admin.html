<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kingshot Viking Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body class="bg-dark text-light">

<div class="container mt-4">

    <h1>⚔ Kingshot Viking Manager</h1>

    <hr>

    <div class="row">

        <div class="col-md-3">

            <div class="list-group" id="sidebar">

                <button
                    class="list-group-item list-group-item-action active"
                    data-page="players">
                    👥 Players
                </button>
            
                <button
                    class="list-group-item list-group-item-action"
                    data-page="heroes">
                    🛡 Heroes
                </button>
            
                <button
                    class="list-group-item list-group-item-action"
                    data-page="groups">
                    📂 Groups
                </button>
            
                <button
                    class="list-group-item list-group-item-action"
                    data-page="generate">
                    ⚔ Generate
                </button>

            </div>

        </div>

        <div class="col-md-9">

            <div id="content">

             
            </div>

        </div>

    </div>

</div>
<!-- Add Player Modal -->
<div class="modal fade" id="playerModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-light">

      <div class="modal-header">
        <h5 class="modal-title">Add Player</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="mb-3">
          <label class="form-label">Player Name</label>
          <input type="text" class="form-control" id="playerName">
        </div>

        <div class="mb-3">
          <label class="form-label">Group</label>

          <select class="form-select" id="playerGroup">
            
          </select>

        </div>

        <div class="mb-3">
          <label class="form-label">Marches</label>

          <select class="form-select" id="playerMarches">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option selected>5</option>
            <option>6</option>
          </select>

        </div>

      </div>

      <div class="modal-footer">

        <button class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>

        <button class="btn btn-success" id="savePlayerBtn">
          Save Player
        </button>

      </div>

    </div>
  </div>
</div>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>  
<script type="module" src="js/admin.js"></script>

</body>
</html>
